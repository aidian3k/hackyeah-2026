services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: splot
      POSTGRES_PASSWORD: splot
      POSTGRES_DB: splot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splot -d splot"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://splot:splot@db:5432/splot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      additional_contexts:
        design-system: ./design-system
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:

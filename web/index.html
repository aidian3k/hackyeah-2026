<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Splot — Małopolski Hub Innowacji Społecznych: znajdź sprawdzone rozwiązania problemów społecznych w Twojej gminie." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ROPS Kraków — Dział Innowacji Społecznych</title>
    <script>
      try {
        if (localStorage.getItem("splot_contrast") === "high") {
          document.documentElement.setAttribute("data-contrast", "high");
        }
        var size = localStorage.getItem("splot_text_size");
        if (size === "large" || size === "xlarge") {
          document.documentElement.setAttribute("data-text-size", size);
        }
      } catch (e) {
        /* brak dostępu do localStorage: zostaje motyw jasny i podstawowy rozmiar tekstu */
      }
    </script>
    <!-- Wyjątek od reguły tokenów: tło przed załadowaniem tokens.css, żeby tryb wysokiego kontrastu nie mignął bielą (wartości = --surface z tokens.css). -->
    <style>
      html { background: #ffffff; }
      html[data-contrast="high"] { background: #000000; color-scheme: dark; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

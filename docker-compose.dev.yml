# Tryb deweloperski z hot reloadem — nakładka na docker-compose.yml:
#   make up-dev   (= docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db api web-dev)
# api:     kod z ./api montowany do kontenera, uvicorn --reload
# web-dev: serwer Vite z HMR na :5173 (zamiast nginx z buildem na :8080)
# Do demo zostaje tryb produkcyjny: make up → :8080.

services:
  api:
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir api

  web-dev:
    image: node:22-alpine
    working_dir: /app/web
    environment:
      VITE_API_TARGET: http://api:8000
    volumes:
      - ./web:/app/web
      - ./design-system:/app/design-system
      # node_modules z kontenera (alpine/musl), nie z hosta
      - web-node-modules:/app/web/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  web-node-modules:
